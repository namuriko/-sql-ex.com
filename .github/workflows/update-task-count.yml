
name: Update SQL task count

on:
  push:
    branches:
      - main
    paths:
      - 'task_*.sql'
      - 'update_task_count.py'
      - '.github/workflows/update-task-count.yml'

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update README
        run: python update_task_count.py

      - name: Save updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update SQL task count"
          git push
